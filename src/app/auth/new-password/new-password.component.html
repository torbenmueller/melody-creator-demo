<div class="container center-h">
	<div class="form-signin">
		<div class="text-center mb-32">
			<div class="icon-container">
				<i class="fas fa-key sign-in-icon"></i>
			</div>
			<h1 class="h3">New Password</h1>
			<p class="white-color">Enter a new password</p>
		</div>
		<form (submit)="onSetNewPassword(newPasswordForm)" #newPasswordForm="ngForm" class="features-box bg-color-2">
			<div>
				<label for="floatingPassword" class="form-label">Password</label>
				<div class="relative">
					<input name="password" [type]="showPassword ? 'text' : 'password'" ngModel
						class="form-control password-input" id="floatingPassword" placeholder="Password"
						#passwordInput="ngModel" required>
					<i [class]="showPassword ? 'fas fa-eye' : 'fas fa-eye-slash'" class="show-password-icon"
						(click)="togglePasswordVisibility()"></i>
				</div>
				@if (!passwordInput.valid && passwordInput.touched) {
					<span class="password-hints">Please enter a password!</span>
				}
			</div>
			<button class="w-100 btn btn-lg btn-success" type="submit" [disabled]="isLoading">Update Password</button>
			@if (isLoading) {
				<div class="center-h">
					<div class="spinner-border" role="status">
						<span class="sr-only">Loading...</span>
					</div>
				</div>
			}
		</form>
	</div>
</div>
